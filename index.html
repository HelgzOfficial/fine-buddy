<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Fine Buddy</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#01352e">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --green-900:#01352e;
    --green-700:#08594f;
    --green-600:#0b6e5f;
    --green-500:#128873;
    --gold-500:#ddba78;
    --gold-400:#eacea0;
    --gold-600:#c49e60;
    --red-500:#e0524f;
    --red-100:#fbe4e4;
    --ink-900:#12201a;
    --ink-700:#3a4a43;
    --ink-500:#6b7b74;
    --line:#e3e9e4;
    --bg:#faf5ec;
    --card:linear-gradient(160deg,var(--green-700),var(--green-900) 70%);
    --radius:20px;
    --shadow:0 4px 16px rgba(1,53,46,0.1);
    font-size:17.5px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink-900);
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:contain;
  }
  #root{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(135deg,var(--green-900),var(--green-700));
    color:#fff;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;
    display:flex; align-items:center; gap:12px;
    box-shadow:var(--shadow);
  }
  .crest{
    width:50px;height:50px;border-radius:50%;
    background:var(--gold-500);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:var(--green-900);font-size:18px;
    overflow:hidden;flex-shrink:0;border:2px solid rgba(255,255,255,0.6);
  }
  .crest img{width:100%;height:100%;object-fit:cover;}
  .team-name-wrap{flex:1;min-width:0;}
  .team-name{font-size:19px;font-weight:800;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .team-sub{font-size:12.5px;opacity:.85;margin-top:1px;}
  .role-switch{
    display:flex;background:rgba(255,255,255,0.15);border-radius:999px;padding:3px;flex-shrink:0;
  }
  .role-switch button{
    border:none;background:transparent;color:#fff;font-size:13px;font-weight:700;
    padding:8px 13px;border-radius:999px;cursor:pointer;opacity:.75;
  }
  .role-switch button.active{background:#fff;color:var(--green-900);opacity:1;}

  /* ---------- Main content ---------- */
  main{flex:1; padding:16px 16px 104px; overflow-y:auto;}
  h1.page-title{font-size:24.5px; margin:2px 0 17px; font-weight:800; color:var(--ink-900);}
  .section-title{font-size:14.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-500);margin:25px 0 12px;}
  .section-title:first-child{margin-top:0;}

  .card{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:14px;
  }
  .card + .card{margin-top:0;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .stat-tile{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px;
  }
  .stat-tile .label{font-size:13px;color:rgba(255,255,255,0.7);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
  .stat-tile .value{font-size:27px;font-weight:800;margin-top:6px;}
  .stat-tile.good .value{color:var(--gold-400);}
  .stat-tile.bad .value{color:#ff9d9a;}

  /* ---------- Shared "gold palette" card treatment ----------
     All the main boxes (cards, stat tiles, list groups, the outstanding %
     tile and verdict cards) now share the same dark-green gradient look as
     the hero "Total Collected" tile, with white text for legibility. The
     "Wanted" poster styling is a deliberately distinct parchment novelty
     look and is excluded from this treatment. */
  .card,.stat-tile,.list-card,.pct-tile,.verdict-card{ color:#fff; }
  .card .muted,.stat-tile .muted,.list-card .muted,.pct-tile .muted,.verdict-card .muted,.poll-card .muted{ color:rgba(255,255,255,0.75); }
  .card .name,.stat-tile .name,.list-card .name,.pct-tile .name,.verdict-card .name{ color:#fff; }
  .card label.field-label,.list-card label.field-label{ color:rgba(255,255,255,0.85); }
  .card .upload-tile,.list-card .upload-tile{ color:rgba(255,255,255,0.75); border-color:rgba(255,255,255,0.35); }
  .card .divider,.list-card .divider,.pct-tile .divider,.verdict-card .divider{ background:rgba(255,255,255,0.18); }
  .card .empty,.list-card .empty,.stat-tile .empty,.pct-tile .empty{ color:rgba(255,255,255,0.7); }

  /* ---------- Grouped list rows (fines catalogue etc) ---------- */
  .list-card{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; margin-bottom:14px;
  }
  .list-row{
    display:flex; align-items:center; gap:14px; padding:16px 18px;
    border-bottom:1px solid rgba(255,255,255,0.14); cursor:pointer; transition:background .12s ease;
  }
  .list-row:last-child{border-bottom:none;}
  .list-row:active{background:rgba(255,255,255,0.08);}
  .list-icon{
    width:44px;height:44px;border-radius:13px;flex-shrink:0;
    background:rgba(255,255,255,0.15); color:var(--gold-400);
    display:flex;align-items:center;justify-content:center;
  }
  .list-icon svg{width:21px;height:21px;}
  .list-icon.gold{background:linear-gradient(135deg,var(--gold-500),var(--gold-600)); color:var(--green-900);}
  .list-row .lbl{flex:1;min-width:0;}
  .list-row .lbl .title{font-weight:700;font-size:17px;}
  .list-row .lbl .sub{font-size:13.5px;color:rgba(255,255,255,0.75);margin-top:3px;}
  .price-tag{font-weight:800;color:var(--gold-400);font-size:17.5px;white-space:nowrap;}
  .price-tag.doubled{color:#ff9d9a;}
  .icon-btn{
    width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,0.15);border:none;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;
    transition:background .12s ease;
  }
  .icon-btn:active{background:rgba(255,255,255,0.25);}
  .icon-btn svg{width:17px;height:17px;}

  .double-bubble-card{transition:box-shadow .2s ease, border-color .2s ease; border:1.5px solid transparent;}
  .double-bubble-card.is-on{border-color:var(--gold-500); box-shadow:0 4px 18px rgba(221,186,120,0.3);}
  .banner-alert{background:linear-gradient(135deg,#f2a4a2,var(--red-500));color:#fff;}

  .pill.committee{background:#e7edff;color:#33449c;}

  /* ---------- Court ---------- */
  .btn-court{
    background:linear-gradient(135deg,#1a1a1a,#000); color:var(--gold-500); border:1.5px solid var(--gold-500);
  }
  .banner.court-banner{
    background:linear-gradient(135deg,#232323,#000); color:var(--gold-500); cursor:pointer;
  }
  .nav-badge{
    position:absolute; top:1px; right:5px; width:9px; height:9px; border-radius:50%;
    background:var(--red-500); border:2px solid #fff;
  }
  .verdict-card{
    display:flex; gap:14px; align-items:flex-start;
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:14px;
    border-left:5px solid var(--ink-500);
  }
  .verdict-card.guilty{border-left-color:var(--red-500);}
  .verdict-card.not-guilty{border-left-color:var(--gold-500);}
  .verdict-gavel{
    width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;
    flex-shrink:0;color:var(--gold-400);
  }
  .verdict-gavel svg{width:20px;height:20px;}
  .verdict-headline{font-size:15.5px;line-height:1.45;}
  .verdict-tag{font-weight:900;padding:2px 9px;border-radius:6px;font-size:13px;}
  .verdict-card.guilty .verdict-tag{background:var(--red-100);color:var(--red-500);}
  .verdict-card.not-guilty .verdict-tag{background:#e2f5ea;color:var(--green-600);}
  .verdict-sub{font-size:13px;color:rgba(255,255,255,0.75);margin-top:5px;font-style:italic;}

  .case-summary{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .case-status-pill{font-weight:800;font-size:12px;padding:5px 11px;border-radius:999px;background:var(--bg);color:var(--ink-700);white-space:nowrap;}
  .case-status-pill.guilty{background:var(--red-100);color:var(--red-500);}
  .case-status-pill.not_guilty{background:#e2f5ea;color:var(--green-600);}
  .case-reason{background:var(--bg);border-radius:12px;padding:13px 15px;font-size:14.5px;font-style:italic;color:var(--ink-700);margin-bottom:16px;}
  .vote-panel{background:var(--bg);border-radius:16px;padding:15px;margin-bottom:10px;}
  .vote-tally{font-size:12.5px;font-weight:700;color:var(--ink-500);text-align:center;margin-bottom:11px;}
  .btn-guilty{background:var(--red-500);color:#fff;}
  .btn-not-guilty{background:var(--green-600);color:#fff;}
  .court-chat{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding:4px 2px;}
  .chat-bubble{background:var(--bg);border-radius:14px;padding:10px 14px;max-width:82%;align-self:flex-start;}
  .chat-bubble.mine{background:var(--green-600);color:#fff;align-self:flex-end;}
  .chat-bubble .chat-sender{font-size:11px;font-weight:800;opacity:.7;margin-bottom:3px;}
  .chat-bubble.mine .chat-sender{color:rgba(255,255,255,0.85);}
  .chat-bubble .chat-body{font-size:14.5px;line-height:1.4;}

  .row{display:flex;align-items:center;gap:12px;}
  .row + .row{margin-top:10px;}
  .between{justify-content:space-between;}

  .avatar{
    width:48px;height:48px;border-radius:50%;overflow:hidden;background:var(--gold-500);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--green-900);font-size:16.5px;flex-shrink:0;
  }
  .avatar.lg{width:140px;height:176px;font-size:40px;border-radius:18px;}
  .avatar.sm{width:34px;height:34px;font-size:13px;border:2px solid #fff;box-shadow:0 1px 4px rgba(1,53,46,0.18);}
  .avatar img{width:100%;height:100%;object-fit:cover;}

  .name{font-weight:700;font-size:17px;}
  .muted{color:var(--ink-500);font-size:14px;}

  .pill{
    display:inline-flex;align-items:center;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:800;
  }
  .pill.owed{background:var(--red-100);color:var(--red-500);}
  .pill.clear{background:#e2f5ea;color:var(--green-600);}
  .pill.gold{background:#fbf0dd;color:#8a6a2f;}

  button{font-family:inherit;}
  .btn{
    border:none;border-radius:14px;padding:16px 20px;font-weight:800;font-size:17px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
    transition:transform .12s ease, filter .12s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--green-600);color:#fff;}
  .btn-primary:active{background:var(--green-700);}
  .btn-gold{background:var(--gold-500);color:var(--green-900);}
  .btn-outline{background:#fff;color:var(--green-700);border:1.5px solid var(--green-600);}
  .btn-ghost{background:var(--bg);color:var(--ink-700);}
  .btn-danger{background:#fff;color:var(--red-500);border:1.5px solid var(--red-500);}
  .btn-sm{padding:10px 14px;font-size:13.5px;width:auto;}
  .btn-block-row{display:flex;gap:10px;}
  .btn-block-row .btn{flex:1;}
  .btn:disabled{opacity:.55;cursor:default;}

  .apple-btn{background:#000;color:#fff;}
  .google-btn{background:#fff;color:#3c4043;border:1.5px solid #dadce0;}
  .paypal-btn{background:#ffc439;color:#003087;}
  .monzo-btn{background:#ff3053;color:#fff;}

  input[type=text],input[type=number],input[type=date],input[type=url],input[type=email],textarea,select{
    width:100%;padding:14px 14px;border-radius:12px;border:1.5px solid var(--line);font-size:16px;background:#fff;color:var(--ink-900);
    font-family:inherit;
  }
  textarea{resize:vertical;min-height:80px;}
  label.field-label{font-size:13.5px;font-weight:700;color:var(--ink-700);margin:12px 0 6px;display:block;}
  label.field-label:first-child{margin-top:0;}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .switch{position:relative;width:52px;height:30px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background:#d3dbd6;border-radius:999px;transition:.2s;}
  .slider:before{content:"";position:absolute;height:24px;width:24px;left:3px;top:3px;background:white;border-radius:50%;transition:.2s;}
  input:checked + .slider{background:var(--gold-500);}
  input:checked + .slider:before{transform:translateX(22px);}

  .fine-chip{
    display:flex;align-items:center;justify-content:space-between;background:#fff;border:1.5px solid var(--line);
    border-radius:14px;padding:15px 16px;margin-bottom:10px;cursor:pointer;font-size:16px;
    transition:transform .12s ease;
  }
  .fine-chip:active{background:var(--bg);transform:scale(0.99);}
  .fine-chip .price{font-weight:800;color:var(--green-700);font-size:16px;}
  .fine-chip .price.doubled{color:var(--red-500);}

  .empty{text-align:center;color:var(--ink-500);font-size:14.5px;padding:28px 10px;}

  nav.bottom-nav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:520px;
    background:#fff; border-top:1px solid var(--line);
    display:flex; padding:8px 4px calc(env(safe-area-inset-bottom,0px) + 8px);
    box-shadow:0 -2px 14px rgba(0,0,0,0.07); z-index:30;
  }
  nav.bottom-nav button{
    flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:6px 2px;cursor:pointer;color:var(--ink-500);font-size:12px;font-weight:700;
    transition:color .15s ease;
  }
  nav.bottom-nav button .ic{
    position:relative; width:40px;height:27px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    transition:background .15s ease, transform .12s ease;
  }
  nav.bottom-nav button .ic svg{width:22px;height:22px;}
  nav.bottom-nav button:active .ic{transform:scale(0.88);}
  nav.bottom-nav button.active{color:var(--green-600);}
  nav.bottom-nav button.active .ic{background:#e2f5ea;}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(1,53,46,0.6);z-index:100;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .modal-backdrop.center{align-items:center;}
  .modal{
    background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;
    padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 22px);
    max-height:88vh;overflow-y:auto;
    animation:slideup .18s ease-out;
  }
  .modal-backdrop.center .modal{border-radius:20px;max-width:440px;margin:20px;}
  @keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-head h2{font-size:19px;margin:0;font-weight:800;}
  .modal-close{background:var(--bg);border:none;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;color:var(--ink-700);}

  .fab{
    position:fixed; bottom:80px; left:50%; transform:translateX(190px);
    width:58px;height:58px;border-radius:50%;background:var(--green-600);color:#fff;font-size:28px;
    border:none;box-shadow:0 6px 18px rgba(11,110,95,0.45);cursor:pointer;z-index:25;
    display:flex;align-items:center;justify-content:center;
  }
  /* Below the app column's own max-width, #root shrinks to fill the viewport,
     so the fixed-position fab needs to track viewport width instead of the
     520px column it otherwise assumes. */
  @media (max-width:519px){ .fab{ transform:translateX(calc(50vw - 72px)); } }

  /* ---------- Tablets & larger screens ----------
     Same design everywhere (so it looks and works identically for every
     player), just a slightly wider, more spacious column instead of a
     narrow phone-width strip marooned in the middle of an iPad screen. */
  @media (min-width:700px){
    #root{ max-width:640px; }
    nav.bottom-nav{ max-width:640px; }
    .modal{ max-width:640px; }
    .fab{ transform:translateX(250px); }
  }

  .banner{
    background:linear-gradient(135deg,var(--gold-400),var(--gold-500));color:var(--green-900);
    border-radius:16px;padding:14px 16px;font-size:14px;font-weight:700;margin-bottom:16px;display:flex;gap:10px;align-items:center;
  }
  .link-btn{color:var(--green-600);font-weight:700;font-size:14px;text-decoration:none;background:none;border:none;cursor:pointer;padding:0;}
  .divider{height:1px;background:var(--line);margin:14px 0;}
  .upload-tile{
    border:1.5px dashed var(--line); border-radius:16px; padding:18px; text-align:center; cursor:pointer; color:var(--ink-500); font-size:14px; font-weight:700;
  }
  .file-hidden{display:none;}
  .center-text{text-align:center;}
  small.disclaimer{display:block;color:var(--ink-500);font-size:12px;margin-top:9px;line-height:1.45;}

  /* ---------- Squad clear strip ---------- */
  .clear-strip{
    display:flex; align-items:center; gap:10px; overflow-x:auto; padding:2px 2px 4px; margin-bottom:16px;
    -webkit-overflow-scrolling:touch;
  }
  .clear-strip::-webkit-scrollbar{display:none;}
  .clear-strip-label{font-size:12px;font-weight:800;color:var(--green-700);text-transform:uppercase;letter-spacing:.4px;flex-shrink:0;white-space:nowrap;}
  .clear-strip-avatars{display:flex;gap:-6px;}
  .clear-strip .avatar.sm{margin-left:-8px;cursor:pointer;}
  .clear-strip .avatar.sm:first-child{margin-left:0;}

  /* ---------- "Add to Home Screen" install banner ---------- */
  .install-banner{
    display:flex; align-items:center; gap:11px; background:#ffffff; color:var(--ink-900);
    border-bottom:1px solid var(--line); padding:12px 14px; box-shadow:0 2px 8px rgba(1,53,46,0.06);
  }
  .install-banner-icon{
    width:38px;height:38px;border-radius:11px;flex-shrink:0;background:var(--bg);color:var(--green-700);
    display:flex;align-items:center;justify-content:center;
  }
  .install-banner-icon svg{width:19px;height:19px;}
  .install-banner-text{flex:1;min-width:0;}
  .install-banner-title{font-weight:800;font-size:14px;}
  .install-banner-sub{font-size:12px;color:var(--ink-500);margin-top:1px;}
  .install-banner-btn{
    border:none;border-radius:10px;background:var(--green-600);color:#fff;font-weight:800;font-size:13px;
    padding:9px 14px;cursor:pointer;flex-shrink:0;white-space:nowrap;
  }
  .install-banner-close{
    border:none;background:none;color:var(--ink-500);font-size:15px;cursor:pointer;flex-shrink:0;padding:4px;
  }
  .install-steps{display:flex;flex-direction:column;gap:14px;}
  .install-step{display:flex;align-items:flex-start;gap:12px;font-size:14.5px;line-height:1.5;}
  .install-step-num{
    width:26px;height:26px;border-radius:50%;background:var(--green-600);color:#fff;font-weight:800;font-size:13px;
    flex-shrink:0;display:flex;align-items:center;justify-content:center;
  }
  .install-step svg{width:16px;height:16px;vertical-align:-3px;display:inline-block;margin:0 2px;}

  /* ---------- Gamified dashboard ---------- */
  .hero-collected{
    background:linear-gradient(160deg,var(--green-700),var(--green-900) 70%);
    border-radius:24px; padding:26px 20px 22px; margin-bottom:14px; text-align:center; color:#fff;
    box-shadow:0 10px 28px rgba(1,53,46,0.32); position:relative; overflow:hidden;
    border:1px solid rgba(221,186,120,0.25);
  }
  .hero-collected::before{
    content:"💰"; position:absolute; font-size:130px; opacity:.09; right:-20px; top:-24px; transform:rotate(-12deg);
  }
  .hero-collected .label{
    font-size:13.5px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:var(--gold-400); position:relative;
  }
  .hero-collected .value{
    font-size:52px; font-weight:900; letter-spacing:-1px; margin:8px 0 3px; position:relative;
    text-shadow:0 2px 10px rgba(0,0,0,0.25);
  }
  .hero-collected .sub{font-size:13px; opacity:.85; position:relative;}

  .pct-tile{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:14px;
    display:flex; align-items:center; gap:16px;
  }
  .pct-ring{
    width:64px;height:64px;border-radius:50%;flex-shrink:0;
    background:conic-gradient(var(--gold-400) calc(var(--pct)*1%), rgba(255,255,255,0.18) 0);
    display:flex;align-items:center;justify-content:center;
  }
  .pct-ring-inner{
    width:49px;height:49px;border-radius:50%;background:var(--green-900);display:flex;align-items:center;justify-content:center;
    font-size:13.5px;font-weight:800;color:var(--gold-400);
  }
  .pct-tile .pct-label{font-size:12.5px;color:rgba(255,255,255,0.7);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
  .pct-tile .pct-detail{font-size:14.5px;font-weight:700;margin-top:3px;}

  .wanted-wrap{margin-bottom:6px;}
  .wanted-poster{
    background:#f3e6c4;
    border:3px double #6b4a1f;
    border-radius:8px;
    padding:18px 16px 16px;
    text-align:center;
    position:relative;
    transform:rotate(-1.3deg);
    box-shadow:0 8px 18px rgba(1,53,46,0.22);
    color:#3d2b12;
  }
  .wanted-poster::after{
    content:"";position:absolute;inset:6px;border:1px solid #b3925a;border-radius:3px;pointer-events:none;
  }
  .wanted-title{
    font-family:Georgia,'Times New Roman',serif; font-weight:900; font-size:22px; letter-spacing:4px;
    color:#5c3a12; margin-bottom:8px; text-transform:uppercase;
  }
  .wanted-photo{
    width:96px;height:96px;border-radius:4px;margin:0 auto 10px;overflow:hidden;
    border:3px solid #5c3a12; background:#cbb98a; display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:30px;color:#5c3a12;
  }
  .wanted-photo img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) sepia(.5) contrast(1.05);}
  .wanted-name{font-family:Georgia,'Times New Roman',serif;font-size:18px;font-weight:800;margin-bottom:2px;}
  .wanted-for{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#7a5a2c;margin-bottom:8px;}
  .wanted-bounty{
    display:inline-block;background:#5c3a12;color:#f3e6c4;font-family:Georgia,serif;font-weight:800;
    padding:6px 16px;border-radius:3px;font-size:16px;letter-spacing:.5px;
  }
  .wanted-bounty .amt{color:var(--gold-400);}

  .wanted-row{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch;}
  .wanted-row::-webkit-scrollbar{display:none;}
  .wanted-poster.compact{width:152px;flex-shrink:0;padding:12px 10px 10px;cursor:pointer;}
  .wanted-poster.compact:active{transform:rotate(-1.3deg) scale(0.97);}
  .wanted-poster.compact .wanted-title{font-size:14px;letter-spacing:2px;margin-bottom:6px;}
  .wanted-poster.compact .wanted-photo{width:62px;height:62px;font-size:19px;margin-bottom:6px;}
  .wanted-poster.compact .wanted-name{font-size:12.5px;margin-bottom:4px;}
  .wanted-poster.compact .wanted-for{font-size:9.5px;margin-bottom:8px;line-height:1.3;min-height:24px;}
  .wanted-poster.compact .wanted-bounty{font-size:12px;padding:4px 9px;}

  /* ---------- Announcements — same "hero" style as Total Collected, but red ---------- */
  .announcement-card{
    background:linear-gradient(160deg,var(--red-500),#a83c39 70%);
    border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; color:#fff;
    box-shadow:0 10px 24px rgba(168,60,57,0.28); position:relative; overflow:hidden;
    border:1px solid rgba(255,255,255,0.18);
  }
  .announcement-card .muted{color:rgba(255,255,255,0.8);}

  /* ---------- Serial Offender ---------- */
  .serial-offender-card{
    display:flex; align-items:center; gap:14px;
  }
  .serial-offender-card .badge{
    width:50px;height:50px;border-radius:14px;flex-shrink:0;background:rgba(255,255,255,0.15);
    display:flex;align-items:center;justify-content:center;font-size:24px;
  }
  .serial-offender-card .so-label{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--gold-400);}
  .serial-offender-card .so-name{font-size:17px;font-weight:800;margin-top:2px;}
  .serial-offender-card .so-count{font-size:13.5px;color:rgba(255,255,255,0.8);margin-top:2px;}

  /* ---------- Events: suggestions + polls ---------- */
  .suggestion-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.14);}
  .suggestion-row:last-child{border-bottom:none;}
  .suggestion-row .who{font-size:12px;font-weight:800;color:var(--gold-400);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;}
  .suggestion-row .txt{font-size:14.5px;line-height:1.4;}

  .poll-card{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:14px; color:#fff;
  }
  .poll-card.closed{opacity:.85;}
  .poll-question{font-size:16.5px;font-weight:800;margin-bottom:12px;}
  .poll-option{
    display:block; width:100%; background:rgba(255,255,255,0.1); border:1.5px solid rgba(255,255,255,0.18);
    border-radius:12px; padding:10px 12px; margin-bottom:8px; cursor:pointer; text-align:left; color:#fff; font-family:inherit;
    position:relative; overflow:hidden;
  }
  .poll-option:last-child{margin-bottom:0;}
  .poll-option.voted{border-color:var(--gold-400);}
  .poll-option[disabled], .poll-option.no-vote{cursor:default;}
  .poll-option-row{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:1;}
  .poll-option-label{font-size:14.5px;font-weight:700;}
  .poll-option-pct{font-size:13px;font-weight:800;color:var(--gold-400);white-space:nowrap;}
  .poll-bar{height:6px;border-radius:999px;background:rgba(255,255,255,0.15);margin-top:8px;overflow:hidden;position:relative;z-index:1;}
  .poll-bar-fill{height:100%;background:var(--gold-400);border-radius:999px;transition:width .25s ease;}
  .poll-votes-count{font-size:11.5px;color:rgba(255,255,255,0.65);margin-top:3px;position:relative;z-index:1;}
  .poll-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;}

  /* ---------- Admin theme — green-themed, distinct from the plain player background,
     with the same dark-green cards. The "Total Collected" hero tile is flipped to gold
     here so it pops out as the one thing admins should notice first. ---------- */
  #root.role-admin{ --bg:#eef6f2; --shadow:0 3px 14px rgba(20,20,20,0.06); }
  #root.role-admin main{background:var(--bg);}
  #root.role-admin .hero-collected{
    background:linear-gradient(160deg,var(--gold-400),var(--gold-600) 70%); color:var(--green-900);
  }
  #root.role-admin .hero-collected::before{opacity:.12;}
  #root.role-admin .hero-collected .label{color:var(--green-900); opacity:.75;}
  #root.role-admin .hero-collected .value{color:var(--green-900); text-shadow:none;}
  #root.role-admin .hero-collected .sub{color:var(--green-900); opacity:.75;}
  #root.role-admin .fab{background:var(--green-700); box-shadow:0 6px 18px rgba(1,53,46,0.32);}
  #root.role-admin .section-title{color:var(--green-700);}
  #root.role-admin nav.bottom-nav{background:#ffffff;}
  #root.role-admin nav.bottom-nav button.active{color:var(--green-700);}
  #root.role-admin nav.bottom-nav button.active .ic{background:#e2f5ea;}
  #root.role-admin .double-bubble-card.is-on{border-color:var(--gold-500); box-shadow:0 4px 18px rgba(221,186,120,0.35);}

  /* ---------- Auth screen ---------- */
  .auth-wrap{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 24px; background:linear-gradient(160deg,var(--green-900),var(--green-700));
    text-align:center;
  }
  .auth-crest{width:92px;height:92px;border-radius:50%;background:var(--gold-500);display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:30px;color:var(--green-900);margin-bottom:16px;overflow:hidden;border:2px solid rgba(255,255,255,0.5);}
  .auth-crest img{width:100%;height:100%;object-fit:cover;}
  .auth-title{color:#fff;font-size:29px;font-weight:900;margin-bottom:7px;}
  .auth-sub{color:rgba(255,255,255,0.8);font-size:14.5px;margin-bottom:28px;max-width:320px;}
  .auth-card{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:360px;box-shadow:0 14px 34px rgba(0,0,0,0.28);}
  .spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--green-900);color:#fff;gap:14px;}
</style>
</head>
<body>
<div id="root"><div class="loading-screen"><div class="spinner" style="width:28px;height:28px;border-width:3px;"></div><div>Loading Fine Buddy…</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
</body>
</html>
