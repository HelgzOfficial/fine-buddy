<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Fine Buddy</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d3b26">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --green-900:#0d3b26;
    --green-700:#155c3a;
    --green-600:#1b7a4d;
    --green-500:#219a5f;
    --gold-500:#e0a72b;
    --gold-400:#f0bf4c;
    --red-500:#d84c4c;
    --red-100:#fbe4e4;
    --ink-900:#12201a;
    --ink-700:#3a4a43;
    --ink-500:#6b7b74;
    --line:#e3e9e4;
    --bg:#f5f7f4;
    --card:#ffffff;
    --radius:16px;
    --shadow:0 2px 10px rgba(13,59,38,0.08);
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink-900);
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:contain;
  }
  #root{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(135deg,var(--green-900),var(--green-700));
    color:#fff;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;
    display:flex; align-items:center; gap:12px;
    box-shadow:var(--shadow);
  }
  .crest{
    width:44px;height:44px;border-radius:50%;
    background:var(--gold-500);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:var(--green-900);font-size:16px;
    overflow:hidden;flex-shrink:0;border:2px solid rgba(255,255,255,0.6);
  }
  .crest img{width:100%;height:100%;object-fit:cover;}
  .team-name-wrap{flex:1;min-width:0;}
  .team-name{font-size:17px;font-weight:800;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .team-sub{font-size:11.5px;opacity:.8;margin-top:1px;}
  .role-switch{
    display:flex;background:rgba(255,255,255,0.15);border-radius:999px;padding:3px;flex-shrink:0;
  }
  .role-switch button{
    border:none;background:transparent;color:#fff;font-size:12px;font-weight:700;
    padding:6px 10px;border-radius:999px;cursor:pointer;opacity:.75;
  }
  .role-switch button.active{background:#fff;color:var(--green-900);opacity:1;}

  /* ---------- Main content ---------- */
  main{flex:1; padding:16px 16px 100px; overflow-y:auto;}
  h1.page-title{font-size:20px; margin:2px 0 14px; font-weight:800; color:var(--ink-900);}
  .section-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-500);margin:22px 0 10px;}
  .section-title:first-child{margin-top:0;}

  .card{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:12px;
  }
  .card + .card{margin-top:0;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-tile{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px;
  }
  .stat-tile .label{font-size:11.5px;color:var(--ink-500);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
  .stat-tile .value{font-size:23px;font-weight:800;margin-top:4px;}
  .stat-tile.good .value{color:var(--green-600);}
  .stat-tile.bad .value{color:var(--red-500);}

  .row{display:flex;align-items:center;gap:12px;}
  .row + .row{margin-top:10px;}
  .between{justify-content:space-between;}

  .avatar{
    width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--gold-500);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--green-900);font-size:15px;flex-shrink:0;
  }
  .avatar.lg{width:84px;height:84px;font-size:26px;}
  .avatar img{width:100%;height:100%;object-fit:cover;}

  .name{font-weight:700;font-size:15px;}
  .muted{color:var(--ink-500);font-size:12.5px;}

  .pill{
    display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:800;
  }
  .pill.owed{background:var(--red-100);color:var(--red-500);}
  .pill.clear{background:#e2f5ea;color:var(--green-600);}
  .pill.gold{background:#fdf1d8;color:#946608;}

  button{font-family:inherit;}
  .btn{
    border:none;border-radius:12px;padding:12px 16px;font-weight:800;font-size:14.5px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  }
  .btn-primary{background:var(--green-600);color:#fff;}
  .btn-primary:active{background:var(--green-700);}
  .btn-gold{background:var(--gold-500);color:var(--green-900);}
  .btn-outline{background:#fff;color:var(--green-700);border:1.5px solid var(--green-600);}
  .btn-ghost{background:var(--bg);color:var(--ink-700);}
  .btn-danger{background:#fff;color:var(--red-500);border:1.5px solid var(--red-500);}
  .btn-sm{padding:8px 12px;font-size:12.5px;width:auto;}
  .btn-block-row{display:flex;gap:8px;}
  .btn-block-row .btn{flex:1;}
  .btn:disabled{opacity:.55;cursor:default;}

  .apple-btn{background:#000;color:#fff;}
  .google-btn{background:#fff;color:#3c4043;border:1.5px solid #dadce0;}
  .paypal-btn{background:#ffc439;color:#003087;}

  input[type=text],input[type=number],input[type=date],input[type=url],input[type=email],textarea,select{
    width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);font-size:14.5px;background:#fff;color:var(--ink-900);
    font-family:inherit;
  }
  textarea{resize:vertical;min-height:70px;}
  label.field-label{font-size:12.5px;font-weight:700;color:var(--ink-700);margin:10px 0 5px;display:block;}
  label.field-label:first-child{margin-top:0;}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .switch{position:relative;width:46px;height:26px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background:#d3dbd6;border-radius:999px;transition:.2s;}
  .slider:before{content:"";position:absolute;height:20px;width:20px;left:3px;top:3px;background:white;border-radius:50%;transition:.2s;}
  input:checked + .slider{background:var(--gold-500);}
  input:checked + .slider:before{transform:translateX(20px);}

  .fine-chip{
    display:flex;align-items:center;justify-content:space-between;background:#fff;border:1.5px solid var(--line);
    border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;
  }
  .fine-chip:active{background:var(--bg);}
  .fine-chip .price{font-weight:800;color:var(--green-700);}
  .fine-chip .price.doubled{color:var(--red-500);}

  .empty{text-align:center;color:var(--ink-500);font-size:13.5px;padding:26px 10px;}

  nav.bottom-nav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:520px;
    background:#fff; border-top:1px solid var(--line);
    display:flex; padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px);
    box-shadow:0 -2px 12px rgba(0,0,0,0.06); z-index:30;
  }
  nav.bottom-nav button{
    flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:6px 2px;cursor:pointer;color:var(--ink-500);font-size:10.5px;font-weight:700;
  }
  nav.bottom-nav button .ic{font-size:19px;line-height:1;}
  nav.bottom-nav button.active{color:var(--green-600);}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(13,32,26,0.55);z-index:100;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .modal-backdrop.center{align-items:center;}
  .modal{
    background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;
    padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 20px);
    max-height:88vh;overflow-y:auto;
    animation:slideup .18s ease-out;
  }
  .modal-backdrop.center .modal{border-radius:18px;max-width:440px;margin:20px;}
  @keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .modal-head h2{font-size:17px;margin:0;font-weight:800;}
  .modal-close{background:var(--bg);border:none;border-radius:50%;width:30px;height:30px;font-size:15px;cursor:pointer;color:var(--ink-700);}

  .fab{
    position:fixed; bottom:76px; left:50%; transform:translateX(190px);
    width:52px;height:52px;border-radius:50%;background:var(--green-600);color:#fff;font-size:26px;
    border:none;box-shadow:0 4px 14px rgba(27,122,77,0.4);cursor:pointer;z-index:25;
    display:flex;align-items:center;justify-content:center;
  }
  @media (max-width:420px){ .fab{ transform:translateX(calc(50vw - 70px)); } }

  .banner{
    background:linear-gradient(135deg,var(--gold-400),var(--gold-500));color:var(--green-900);
    border-radius:14px;padding:12px 14px;font-size:13px;font-weight:700;margin-bottom:14px;display:flex;gap:10px;align-items:center;
  }
  .link-btn{color:var(--green-600);font-weight:700;font-size:13px;text-decoration:none;background:none;border:none;cursor:pointer;padding:0;}
  .divider{height:1px;background:var(--line);margin:12px 0;}
  .upload-tile{
    border:1.5px dashed var(--line); border-radius:14px; padding:16px; text-align:center; cursor:pointer; color:var(--ink-500); font-size:13px; font-weight:700;
  }
  .file-hidden{display:none;}
  .center-text{text-align:center;}
  small.disclaimer{display:block;color:var(--ink-500);font-size:11px;margin-top:8px;line-height:1.4;}

  /* ---------- Gamified dashboard ---------- */
  .hero-collected{
    background:linear-gradient(160deg,var(--green-700),var(--green-900) 70%);
    border-radius:22px; padding:22px 18px 20px; margin-bottom:12px; text-align:center; color:#fff;
    box-shadow:0 8px 24px rgba(13,59,38,0.28); position:relative; overflow:hidden;
  }
  .hero-collected::before{
    content:"💰"; position:absolute; font-size:120px; opacity:.08; right:-20px; top:-24px; transform:rotate(-12deg);
  }
  .hero-collected .label{
    font-size:12.5px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:var(--gold-400); position:relative;
  }
  .hero-collected .value{
    font-size:48px; font-weight:900; letter-spacing:-1px; margin:6px 0 2px; position:relative;
    text-shadow:0 2px 10px rgba(0,0,0,0.25);
  }
  .hero-collected .sub{font-size:12px; opacity:.8; position:relative;}

  .pct-tile{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; margin-bottom:12px;
    display:flex; align-items:center; gap:14px;
  }
  .pct-ring{
    width:58px;height:58px;border-radius:50%;flex-shrink:0;
    background:conic-gradient(var(--red-500) calc(var(--pct)*1%), #e9eee9 0);
    display:flex;align-items:center;justify-content:center;
  }
  .pct-ring-inner{
    width:44px;height:44px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:800;color:var(--red-500);
  }
  .pct-tile .pct-label{font-size:11.5px;color:var(--ink-500);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
  .pct-tile .pct-detail{font-size:13.5px;font-weight:700;margin-top:2px;}

  .wanted-wrap{margin-bottom:6px;}
  .wanted-poster{
    background:#f3e6c4;
    border:3px double #6b4a1f;
    border-radius:6px;
    padding:16px 16px 14px;
    text-align:center;
    position:relative;
    transform:rotate(-1.3deg);
    box-shadow:0 6px 16px rgba(60,40,10,0.25);
    color:#3d2b12;
  }
  .wanted-poster::after{
    content:"";position:absolute;inset:6px;border:1px solid #b3925a;border-radius:3px;pointer-events:none;
  }
  .wanted-title{
    font-family:Georgia,'Times New Roman',serif; font-weight:900; font-size:22px; letter-spacing:4px;
    color:#5c3a12; margin-bottom:8px; text-transform:uppercase;
  }
  .wanted-photo{
    width:96px;height:96px;border-radius:4px;margin:0 auto 10px;overflow:hidden;
    border:3px solid #5c3a12; background:#cbb98a; display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:30px;color:#5c3a12;
  }
  .wanted-photo img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) sepia(.5) contrast(1.05);}
  .wanted-name{font-family:Georgia,'Times New Roman',serif;font-size:18px;font-weight:800;margin-bottom:2px;}
  .wanted-for{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#7a5a2c;margin-bottom:8px;}
  .wanted-bounty{
    display:inline-block;background:#5c3a12;color:#f3e6c4;font-family:Georgia,serif;font-weight:800;
    padding:6px 16px;border-radius:3px;font-size:16px;letter-spacing:.5px;
  }
  .wanted-bounty .amt{color:var(--gold-400);}

  /* ---------- Auth screen ---------- */
  .auth-wrap{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 24px; background:linear-gradient(160deg,var(--green-900),var(--green-700));
    text-align:center;
  }
  .auth-crest{width:84px;height:84px;border-radius:50%;background:var(--gold-500);display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:28px;color:var(--green-900);margin-bottom:14px;overflow:hidden;}
  .auth-crest img{width:100%;height:100%;object-fit:cover;}
  .auth-title{color:#fff;font-size:26px;font-weight:900;margin-bottom:6px;}
  .auth-sub{color:rgba(255,255,255,0.75);font-size:13.5px;margin-bottom:26px;max-width:320px;}
  .auth-card{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:360px;box-shadow:0 12px 30px rgba(0,0,0,0.25);}
  .spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--green-900);color:#fff;gap:14px;}
</style>
</head>
<body>
<div id="root"><div class="loading-screen"><div class="spinner" style="width:28px;height:28px;border-width:3px;"></div><div>Loading Fine Buddy…</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
</body>
</html>
